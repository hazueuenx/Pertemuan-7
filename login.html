<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Layout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light justify-content-center d-flex flex-row">
    <div class="bg-blue w-50">
      <img
        src="peakpx.jpg"
        alt="Description of the image"
        width="100%"
        height="100%"
      />
    </div>
    <div class="bg-light w-50 d-flex align-items-center justify-content-center">
      <div class="card w-75 text-secondary bg-transparent border-0">
        <div class="card-body text-start d-grid gap-3">
          <h5 class="card-title">Welcome Back!</h5>
          <form>
            <label for="name">Username:</label><br />
            <input
              class="rounded-2 w-100 border-secondary border"
              type="text"
            /><br />
            <label for="name">Password:</label><br />
            <input
              class="rounded-2 w-100 border-secondary border"
              type="password"
            /><br />
          </form>
          <a href="login.html" class="btn bg-dark-blue text-white">Login</a>
          <a href="#" class="text-center">Forgot Password?</a>
        </div>
      </div>
    </div>
  </body>
</html>
