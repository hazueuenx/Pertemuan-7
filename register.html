<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Layout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light justify-content-center d-flex flex-row">
    <div class="bg-light w-50 d-flex align-items-center justify-content-center">
      <div class="card text-secondary bg-transparent border-0">
        <div class="card-body text-start d-grid gap-3">
          <h5 class="card-title">Please Sign Up</h5>
          <form>
            <div class="d-flex justify-content-between">
              <div class="col-5">
                <label for="name">First Name:</label><br />
                <input
                  class="rounded-2 w-100 border-secondary border"
                  type="text"
                /><br />
              </div>
              <div class="col"></div>
              <div class="col-5">
                <label for="name">Last Name:</label><br />
                <input
                  class="rounded-2 w-100 border-secondary border"
                  type="text"
                /><br />
              </div>
            </div>
            <label for="name">Display Name:</label><br />
            <input
              class="rounded-2 w-100 border-secondary border"
              type="text"
            /><br />
            <label for="name">Email Address:</label><br />
            <input
              class="rounded-2 w-100 border-secondary border"
              type="password"
            /><br />
            <div class="d-flex justify-content-between">
              <div class="col-5">
                <label for="name">Password:</label><br />
                <input
                  class="rounded-2 w-100 border-secondary border"
                  type="password"
                /><br />
              </div>
              <div class="col"></div>
              <div class="col-5">
                <label for="name">Confirm Password:</label><br />
                <input
                  class="rounded-2 w-100 border-secondary border"
                  type="password"
                /><br />
              </div>
            </div>
            <div class="d-flex justify-content-between mt-2">
              <input
                type="checkbox"
                id="vehicle1"
                name="vehicle1"
                value="Bike"
              />
              <label for="vehicle1">
                By clicking register you agree to the Terms and<br />
                conditions set out by this site </label
              ><br />
            </div>
          </form>
          <div class="d-flex justify-content-between">
            <a href="login.html" class="col-5 btn bg-dark-blue text-white"
              >Register</a
            >
            <div class="col"></div>
            <a href="login.html" class="col-5 btn bg-dark-blue text-white"
              >Sign In</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
