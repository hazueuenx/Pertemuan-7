<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Layout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header class="bg-blue-gradient text-white p-3">
      <div class="container">
        <h2 class="mb-0">Pertemuan 7</h2>
        <nav class="mt-2">
          <a href="#" class="btn bg-dark-blue text-white me-2">Home</a>
          <a href="#" class="btn bg-dark-blue text-white me-2">About</a>
          <a href="#" class="btn bg-dark-blue text-white">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <div class="mt-5">
      <div class="d-flex justify-content-center">
        <!-- Konten -->
        <main class="mt-5">
          <h3 class="fw-bold mb-3">Konten</h3>
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card bg-blue text-white h-100">
                <div class="card-body">
                  <h5 class="card-title">Login Page</h5>
                  <p class="card-text">
                    Klik tombol dibawah ini untuk diarahkan ke page Login
                  </p>
                  <a href="login.html" class="btn bg-dark-blue text-white"
                    >Login</a
                  >
                </div>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="card bg-blue text-white h-70">
                <div class="card-body">
                  <h5 class="card-title">Register Page</h5>
                  <p class="card-text">
                    Klik tombol dibawah ini untuk diarahkan ke page Register
                  </p>
                  <a href="register.html" class="btn bg-dark-blue text-white"
                    >Register</a
                  >
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 align-bottom">
      <div class="container d-flex justify-content-between">
        <div>
          <small>© 2026 Muhammad Alhady Rizq. All rights reserved.</small>
        </div>
        <div>
          <a href="#" class="text-white me-3">Privacy</a>
          <a href="#" class="text-white me-3">Terms</a>
          <a href="#" class="text-white">Support</a>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
